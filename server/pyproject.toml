[project]
name = "express-assistant-server"
version = "0.1.1"
description = "快递助手 PC 服务器：独立抓取小米/京东/淘宝/拼多多快递，提供网页查看与 AI（REST / MCP）接口"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
    "playwright>=1.45",
]

[project.scripts]
express-server = "express_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["express_server"]

[tool.hatch.build.targets.sdist]
only-include = ["express_server", "tests", "README.md", "pyproject.toml", "uv.lock"]
